[project]
name = "escudo-backend"
version = "0.1.0"
description = "Escudo — agent-ready car insurer backend (REST, MCP, A2A, voice)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-adk[a2a]>=2.10",
    "a2a-sdk[http-server]>=1.2",
    "mcp>=2.2",
    "google-genai>=2.25",
    "firebase-admin>=7.7",
    "google-cloud-firestore>=2.33",
    "google-cloud-storage>=3.15",
    "fastapi>=0.133",
    "uvicorn[standard]>=0.40",
    "jsonschema>=4.26",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.1",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "websockets>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["escudo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning:google.adk.*",
    "ignore:.*EXPERIMENTAL.*:UserWarning",
    "ignore::DeprecationWarning",
]
